<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · DouchkoVE</title>
<style>
:root{--bg:#0a0a0b;--surf:#161417;--surf2:#1e1c20;--fg:#f6f4ef;--mut:#b0a99e;--mut2:#8b857b;
  --acc:#ff7a1a;--line:#242320;--ok:#3ec46d;--warn:#f2c14e;--bad:#ff5233;--info:#5b9dff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);
  color:var(--fg);line-height:1.5;padding:22px 20px 60px;min-height:100vh;font-size:14px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
h1 .dot{color:var(--acc)}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);margin:22px 0 10px;font-weight:700}
.subtle{color:var(--mut2);font-size:12px}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.gate{max-width:360px;margin:14vh auto 0;text-align:center}
.gate input{width:100%;padding:12px 14px;background:var(--surf);border:1px solid var(--line);border-radius:10px;color:var(--fg);font-size:15px;margin:14px 0}
.btn{background:var(--acc);color:#111;border:none;font-weight:700;font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.warn{background:var(--warn);color:#111}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(62,196,109,.5);animation:pl 2s infinite}
.pulse.off{background:var(--mut2);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(62,196,109,.5)}70%{box-shadow:0 0 0 7px rgba(62,196,109,0)}100%{box-shadow:0 0 0 0 rgba(62,196,109,0)}}
/* v195: Seitenleiste statt Tab-Reihe. Zwoelf Tabs in einer umbrechenden
   Zeile waren schon zu viel, und jede neue Ansicht machte es schlimmer.
   Eine gruppierte Seitenleiste haelt beliebig viele Punkte aus und sagt
   nebenbei, WAS zusammengehoert. */
.shell{display:grid;grid-template-columns:212px 1fr;gap:22px;align-items:start}
/* Ein Grid-Kind hat per Voreinstellung min-width:auto und kann deshalb nicht
   schmaler werden als sein breitester Inhalt - eine breite Tabelle schiebt
   dann die GANZE Seite auf. Der Seitenkoerper darf nie quer scrollen;
   breite Inhalte scrollen in ihrem eigenen Kasten. */
.shell>main{min-width:0}
#view{overflow-x:auto}
body{overflow-x:hidden}
.side{position:sticky;top:22px;background:var(--surf);border:1px solid var(--line);
  border-radius:14px;padding:14px 10px;max-height:calc(100vh - 44px);overflow:auto}
.side .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;
  border-bottom:1px solid var(--line);margin-bottom:10px}
.side .brand b{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.side .brand .dot{color:var(--acc)}
.navgrp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);
  font-weight:700;padding:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;
  color:var(--mut);font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer;
  border:1px solid transparent;transition:background .12s,color .12s}
.side a:hover{background:var(--surf2);color:var(--fg)}
.side a.on{background:var(--surf2);color:var(--fg);border-color:var(--line)}
.side a.on svg{color:var(--acc)}
.side a svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--mut2)}
.side a .badge{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--bad);
  background:rgba(255,82,51,.14);border-radius:999px;padding:1px 7px}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut2);
  margin:0 0 14px;flex-wrap:wrap}
.crumb b{color:var(--fg);font-weight:700}
.crumb span{opacity:.5}
.navtog{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr;gap:14px}
  .side{position:static;max-height:none;padding:10px}
  .side.zu .navgrp,.side.zu a{display:none}
  .navtog{display:inline-flex;align-items:center;gap:8px;margin-left:auto;
    background:transparent;border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .side .brand{border-bottom:0;margin-bottom:0;padding-bottom:4px}
  .side.zu .brand{border-bottom:0}
}
.grid{display:grid;gap:11px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2)}
.card .v{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-top:5px}
.card .v small{font-size:12px;font-weight:600;color:var(--mut)}
.card.acc .v{color:var(--acc)}
.health{display:flex;flex-wrap:wrap;gap:9px 20px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:7px}
.led{width:9px;height:9px;border-radius:50%;background:var(--mut2);flex:0 0 auto}
.led.ok{background:var(--ok)}.led.warn{background:var(--warn)}.led.bad{background:var(--bad)}
table{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut2);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
tr.click{cursor:pointer}tr.click:hover{background:var(--surf)}
.search{padding:8px 11px;background:var(--surf);border:1px solid var(--line);border-radius:8px;color:var(--fg)}
select.search{cursor:pointer}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(62,196,109,.4)}
.tag.no{color:var(--bad);border-color:rgba(255,82,51,.4)}
.tag.buy{color:var(--acc);border-color:rgba(255,122,26,.4)}
.tag.warn{color:var(--warn);border-color:rgba(242,193,78,.4)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:34px 14px;overflow:auto;z-index:50}
.overlay.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;padding:22px}
.modal h2{font-size:17px;margin-bottom:2px;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.acts input{width:78px;padding:6px 9px;background:var(--surf);border:1px solid var(--line);border-radius:8px;color:var(--fg)}
.acts input.reason{width:140px}
.msg{font-size:12.5px;color:var(--mut);margin-top:8px;min-height:16px}
.scroll{max-height:280px;overflow:auto;margin-top:4px;border:1px solid var(--line);border-radius:8px}
.pos{color:var(--ok)}.neg{color:var(--mut)}
.hidden{display:none}
.bars{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:8px}
.bars i{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
/* v136: dynamische Grafen (reines SVG, kein Framework) */
.chart{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:13px 16px 9px}
.chart .ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chart .ct b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut2);font-weight:700}
.chart .ct span{font-size:12px;color:var(--mut)}
.chart svg{display:block;width:100%}
.chart .cx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut2);margin-top:3px}
.chart rect{transition:opacity .15s}
.chart rect:hover{opacity:1 !important}
.hbars{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.hb{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
.hb .hl{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .ht{height:14px;background:var(--surf2);border-radius:7px;overflow:hidden}
.hb .ht i{display:block;height:100%;background:var(--acc);border-radius:7px;min-width:2px;transition:width .4s}
.hb .hv{text-align:right;color:var(--fg);font-weight:700;font-size:12px}
.row-actions{display:flex;gap:5px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:12.5px}
.kv .kk{color:var(--mut2)}
.note{font-size:11.5px;color:var(--mut2);margin-top:10px;font-style:italic}
.spin{color:var(--mut2);padding:14px 2px}

/* v206 Startseite: eine Zahl je Frage, gross, mit einem Satz daneben. Alles
   Technische bleibt in den anderen Ansichten - es steht nur nicht mehr vorn. */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.hero .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero .frage{font-size:12.5px;color:var(--dim);letter-spacing:.02em;margin-bottom:6px}
.hero .zahl{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.hero .zahl small{font-size:15px;font-weight:600;color:var(--dim);margin-left:4px}
.hero .satz{margin-top:8px;font-size:13px;color:var(--dim);line-height:1.5}
.hero .box.gruen{border-color:rgba(60,200,120,.45)}
.hero .box.gelb{border-color:rgba(255,180,40,.5)}
.hero .box.rot{border-color:rgba(255,90,90,.55)}
.ampel{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:1px}
.ampel.gruen{background:#3cc878}.ampel.gelb{background:#ffb428}.ampel.rot{background:#ff5a5a}
.tuwas{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}
/* v208 Trichter: eine Zeile je Stufe, Balkenbreite = Anteil an ganz oben. */
.tri{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.trow{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.trow .tt{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.trow .tt b{font-size:14px}
.trow .tn{font-size:22px;font-weight:800;letter-spacing:-.02em}
.trow .tbar{height:12px;background:var(--surf2);border-radius:7px;overflow:hidden;margin:9px 0 7px}
.trow .tbar i{display:block;height:100%;background:var(--acc);border-radius:7px;min-width:3px;transition:width .4s}
.trow .te{font-size:12.5px;color:var(--mut);line-height:1.5}
.trow .tdrop{font-weight:700}
.trow .tdrop.warn{color:var(--warn)}.trow .tdrop.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>DouchkoVE <span class="dot">Admin</span></h1>
    <p class="subtle" style="margin-top:6px">Enter the admin key (server env DVE_ADMIN).</p>
    <input type="password" id="keyIn" placeholder="Admin key" autocomplete="off" data-enter="saveKey">
    <button class="btn" data-act="saveKey">Unlock</button>
    <p class="msg" id="gateMsg"></p>
  </div>

  <div id="app" class="hidden">
    <div class="shell">
      <aside class="side zu" id="side">
        <div class="brand">
          <b>DouchkoVE <span class="dot">Admin</span></b>
          <button class="navtog" data-act="navTog" id="navBtn">Menu</button>
        </div>
        <nav id="nav"></nav>
      </aside>
      <main>
        <div class="top">
          <div>
            <div class="crumb"><b>Admin</b><span>&rsaquo;</span><b id="crumbNow">Live</b></div>
            <h1 id="viewTitle">Live</h1>
            <span class="subtle" id="buildLine">live ops console</span>
          </div>
          <div class="live">
            <span class="pulse" id="pulse"></span><span id="liveTxt">live</span>
            <button class="btn ghost sm" data-act="togglePause" id="pauseBtn">Pause</button>
            <button class="btn ghost sm" data-act="logout">Lock</button>
          </div>
        </div>
        <div id="view" style="margin-top:16px"><div class="spin">Loading…</div></div>
      </main>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" data-overlay="1"><div class="modal" id="modal"></div></div>

<script>
let KEY = sessionStorage.getItem('dve_admin_key') || '';
let POLL=null, TICK=null, paused=false, active='start', lastLoad={}, serverNow=0;
const AUTO={start:30000, live:15000, jobs:5000, alerts:20000};
/* v195: Navigation in Abschnitte gruppiert. Die zwoelf Ansichten sind
   unveraendert - nur ihre Anordnung sagt jetzt, was zusammengehoert.
   Reihenfolge folgt dem Arbeitsalltag: erst was gerade passiert, dann Geld,
   dann Kunden, dann Betrieb und Recht. */
const ICON={
  offsite:'<path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.2"/><path d="M12 12v9m0 0 3.5-3.5M12 21l-3.5-3.5"/>',
  start:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
  live:'<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  alerts:'<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  jobs:'<path d="M4 7h16M4 12h16M4 17h10"/>',
  revenue:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  credits:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/>',
  codes:'<path d="M8 4 5 20M19 4l-3 16M3 9h18M2 15h18"/>',
  users:'<path d="M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="3.5"/><path d="M21 20v-2a4 4 0 0 0-3-3.9"/>',
  support:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l2-4.2A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>',
  abuse:'<path d="M12 3 3 7v5c0 5 3.8 8.6 9 9.7 5.2-1.1 9-4.7 9-9.7V7l-9-4z"/><path d="M12 9v4m0 3h.01"/>',
  system:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  compliance:'<path d="M9 11l2 2 4-4"/><path d="M20 12a8 8 0 1 1-8-8 8 8 0 0 1 8 8z"/>',
  legal:'<path d="M12 3v18M5 7h14M7 7l-3 6h6zM17 7l-3 6h6z"/>',
  feedback:'<path d="M12 3 14.9 8.9l6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.6 9.8l6.5-.9z"/>',
  ann:'<path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
  logs:'<path d="M6 3h9l5 5v13H6z"/><path d="M9 12h7M9 16h7M9 8h3"/>',
  events:'<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  trichter:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>',
};
const NAV=[
  ['', [['start','Start'],['live','Live'],['alerts','Alerts'],['jobs','Jobs']]],
  ['Umsatz', [['revenue','Revenue'],['trichter','Trichter'],['credits','Credits'],['codes','Codes']]],
  ['Kunden', [['users','Users'],['support','Support'],['abuse','Abuse']]],
  ['Produkt', [['feedback','Feedback'],['ann','Announcements']]],
  ['Betrieb', [['system','System'],['offsite','Sicherung'],['events','Chronik'],['logs','Logs'],['compliance','Compliance'],['legal','Recht & Steuern']]],
];
const TABS=NAV.flatMap(([,items])=>items);
const TITEL=Object.fromEntries(TABS);
const $=s=>document.querySelector(s), el=id=>document.getElementById(id);
function hdr(){return {'X-Admin-Key':KEY};}
async function api(path,opts={}){
  opts.headers=Object.assign(hdr(),opts.headers||{});
  const r=await fetch(path,opts);
  if(r.status===403){logout('Wrong or missing key.');throw new Error('403');}
  if(!r.ok){let d={};try{d=await r.json();}catch(e){}throw new Error(d.detail||('HTTP '+r.status));}
  const ct=r.headers.get('content-type')||''; return ct.includes('json')?r.json():r.text();
}
function saveKey(){KEY=el('keyIn').value.trim();if(!KEY)return;sessionStorage.setItem('dve_admin_key',KEY);boot();}
function logout(m){KEY='';sessionStorage.removeItem('dve_admin_key');stopPoll();el('app').classList.add('hidden');el('gate').classList.remove('hidden');if(m)el('gateMsg').textContent=m;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fdt(ts){if(!ts)return '–';const d=new Date(ts*1000);return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
/* v136: dynamische Grafen. Reines SVG, kein Framework (CSP-sicher).
   barChart: Tages-Balken, Hover zeigt Datum+Wert, letzter Balken (heute)
   voll orange, Summen/Max oben rechts. hbars: horizontale Verteilung. */
function sdt(d){if(!d)return '';return d.length===7?d.slice(5,7)+'/'+d.slice(0,4):d.slice(8,10)+'.'+d.slice(5,7);}
function barChart(title,labels,values,fmt,height){
  fmt=fmt||(v=>String(v)); height=height||96;
  const n=values.length;
  if(!n||values.every(v=>!v))
    return `<div class="chart"><div class="ct"><b>${title}</b><span>no data yet</span></div>
      <div class="subtle" style="padding:16px 0 12px">Nothing in this period.</div></div>`;
  const mx=Math.max(...values,1e-9);
  const W=1000,H=height,gap=Math.min(6,Math.max(1.2,W/n*0.18)),bw=(W-gap*(n-1))/n;
  let bars='';
  for(let i=0;i<n;i++){
    const h=values[i]>0?Math.max(2.5,values[i]/mx*(H-6)):1.2;
    const x=i*(bw+gap),y=H-h,last=i===n-1;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--acc)" opacity="${last?1:(values[i]>0?0.55:0.16)}"><title>${labels[i]}: ${fmt(values[i])}</title></rect>`;
  }
  const total=Math.round(values.reduce((a,b)=>a+b,0)*100)/100;
  const mid=labels[Math.floor(n/2)]||'';
  return `<div class="chart"><div class="ct"><b>${title}</b><span>peak ${fmt(Math.round(mx*100)/100)} · total ${fmt(total)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
      <line x1="0" y1="0.5" x2="${W}" y2="0.5" stroke="var(--line)" stroke-dasharray="3 5"/>${bars}</svg>
    <div class="cx"><span>${sdt(labels[0])}</span><span>${sdt(mid)}</span><span>${sdt(labels[n-1])} · today</span></div></div>`;
}
function hbars(items,fmt){
  fmt=fmt||(v=>String(v));
  if(!items.length||items.every(i=>!i.v))return '<div class="subtle">none yet</div>';
  const mx=Math.max(...items.map(i=>i.v),1e-9);
  return `<div class="hbars">${items.map(i=>`<div class="hb"><span class="hl" title="${esc(i.l)}">${esc(i.l)}</span><span class="ht"><i style="width:${Math.max(2,Math.round(i.v/mx*100))}%${i.c?';background:'+i.c:''}"></i></span><span class="hv">${fmt(i.v)}</span></div>`).join('')}</div>`;
}
let TS_CACHE={};
async function tseries(days){
  const k=String(days), now=Date.now();
  if(TS_CACHE[k]&&now-TS_CACHE[k].t<60000)return TS_CACHE[k].d;   // 60s-Cache
  const d=await api('/api/admin/timeseries?days='+days);
  TS_CACHE[k]={t:now,d};return d;
}
function fdate(ts){return ts?new Date(ts*1000).toLocaleDateString():'–';}
function ago(ts){if(!ts)return 'never';const s=Math.max(0,Math.floor((serverNow||Date.now()/1000)-ts));if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function dur(s){if(s==null)return '–';s=Math.round(s);if(s<60)return s+'s';const m=Math.floor(s/60);return m+'m '+(s%60)+'s';}
function eur(n){return '€'+Number(n||0).toFixed(2);}

  el('crumbNow').textContent=t; el('viewTitle').textContent=t;

/* v228c Ein Log ist zum WEITERGEBEN da. Bis hier musste man ihn im Handy
   muehsam markieren; jetzt ein Klick fuer alles, plus ein eigener Knopf fuer
   die Timing-Zeile - die ist die eine, die man beim Thema Renderzeit
   braucht. Fallback ohne Zwischenablage-Recht (Safari ohne HTTPS-Kontext):
   Text markieren, damit Kopieren wenigstens von Hand geht. */
function copyText(txt, btn){
  const fertig = ok => { if(!btn) return; const alt = btn.textContent;
    btn.textContent = ok ? 'Kopiert' : 'Bitte manuell'; setTimeout(()=>{btn.textContent=alt;},1600); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(()=>fertig(true),()=>fertig(false));
  } else {
    const ta=document.createElement('textarea'); ta.value=txt;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); fertig(ok);
  }
}

/* Der Admin-Key steht im HEADER, nicht in der URL - ein <a href> kann ihn
   also nicht mitschicken (und in der URL haette er nichts zu suchen: er
   landete in History und Server-Log). Deshalb ueber fetch + Blob, genau wie
   der CSV-Export. */
function bkDl(datei){
  fetch('/api/admin/backup/download?datei='+encodeURIComponent(datei),{headers:hdr()})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.blob();})
    .then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download=datei;a.click();}).catch(e=>alert(e.message));
}

   Stripe-Belege bleiben im Stripe-Dashboard. Tipp-Bestaetigung 'RESET'. */
async function factoryReset(){
  const t=prompt('This wipes ALL users, credits, purchases, tickets, jobs and caches. Stripe records stay in Stripe. Type RESET to confirm.');
  if(t===null)return;
  if(t.trim()!=='RESET'){alert('Not confirmed. Nothing was deleted.');return;}
  try{const fd=new FormData();fd.append('confirm','RESET');
    const d=await api('/api/admin/factory_reset',{method:'POST',body:fd});

  }catch(e){alert(e.message);}
}

/* ---------- RECHT & STEUERN (v142) ----------
   Alles gesetzlich Relevante an EINER Stelle, gerechnet aus den echten
   Buchungen: Steuer-Identitaet, §19-Schwellen mit Ampel, Umsatz je Jahr und
   Monat, Belege, Aufbewahrungsfristen, Verarbeitungsverzeichnis (Art. 30
   DSGVO), Links auf die Rechtsseiten. Bewusst als Uebersicht deklariert,
   nicht als Steuerberatung. */
function eur(c){return (c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' \u20ac';}
function lamp(state){
  const m={ok:['ok','within limit'],warn:['no','80%+ of the limit'],ueber:['no','LIMIT EXCEEDED']};
  const s=m[state]||m.ok;return `<span class="tag ${s[0]}">${s[1]}</span>`;
}
function meter(ist,grenze,state){
  const pct=Math.min(100,Math.round(ist/Math.max(grenze,1)*100));
  const col=state==='ok'?'var(--acc)':(state==='warn'?'#e3a008':'var(--bad)');
  return `<span class="ht" style="display:inline-block;width:160px;vertical-align:middle"><i style="width:${Math.max(1,pct)}%;background:${col}"></i></span> <span class="subtle">${pct}%</span>`;
}

        : `<textarea class="search" id="rp${t.id}" rows="3" placeholder="Write your reply …"

    <td class="subtle">${a.gemailt?'mailed':'panel only'}</td>
    <td class="subtle">${new Date(a.created_at*1000).toLocaleString()}</td>
    <td>${a.gelesen?'':`<button class="btn" data-act="alertRead" data-arg="${a.id}">Mark read</button>`}</td>
  </tr>`).join(''):'<tr><td colspan="6" class="subtle">No alerts.</td></tr>';
  el('view').innerHTML=`
    <h3>Alerts <span class="subtle">${d.offen} unread</span>
      <button class="btn" style="float:right" data-act="alertRead" data-arg="0">Mark all read</button></h3>

    <table><thead><tr><th></th><th>What</th><th>Detail</th><th>Mail</th><th>When</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
async function alertRead(id){const fd=new FormData();fd.append('id',id);try{await api('/api/admin/alerts/read',{method:'POST',body:fd});loadAlerts();}catch(e){alert(e.message);}}

function err(e){return '<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Error</b> '+esc(e.message)+'</div>';}
/* ---------- v196 FEEDBACK ----------
   Bewusst nicht dasselbe wie Support: ein Ticket ist eine Frage mit
   Antworterwartung, Feedback ist eine Bewertung ohne. Der Wert steckt in
   der VERTEILUNG und im Schnitt JE LOOK - eine blosse Liste sagt nichts
   darueber, wo das Produkt enttaeuscht. */
let fbFilt='all';
function sterne(n){return '★'.repeat(n)+'<span style="color:var(--line)">'+'★'.repeat(5-n)+'</span>';}
async function loadFeedback(silent){
  let d;try{d=await api('/api/admin/feedback?filt='+fbFilt);}catch(e){if(!silent)el('view').innerHTML=err(e);return;}
  lastLoad.feedback=Date.now()/1000;
  setBadge('feedback', d.offen||0);          // sofort, nicht erst nach 30 s
  const max=Math.max(1,...Object.values(d.verteilung));
  const bars=[5,4,3,2,1].map(n=>{
    const c=d.verteilung[n]||0;
    return `<div style="display:flex;align-items:center;gap:9px;margin:5px 0">
      <span style="width:58px;color:var(--mut2);font-size:12px">${n} ★</span>
      <div style="flex:1;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${Math.round(c/max*100)}%;background:${n>=4?'var(--ok)':n===3?'var(--warn)':'var(--bad)'}"></div></div>
      <span style="width:38px;text-align:right;font-size:12px">${c}</span></div>`;}).join('');
  const looks=d.looks.length?d.looks.map(l=>
    `<tr><td>${esc(l.look)}</td><td>${l.c}</td>
     <td style="color:${l.avg>=4?'var(--ok)':l.avg>=3?'var(--warn)':'var(--bad)'}">${Number(l.avg).toFixed(2)}</td></tr>`
    ).join(''):'<tr><td colspan="3" class="subtle">No ratings with a look yet.</td></tr>';
  const rows=d.items.length?d.items.map(f=>`<tr${f.gelesen?'':' style="background:rgba(255,122,26,.06)"'}>
      <td style="white-space:nowrap;color:${f.note>=4?'var(--ok)':f.note>=3?'var(--warn)':'var(--bad)'}">${sterne(f.note)}</td>
      <td>${esc(f.name||'')}<div class="subtle">${esc(f.email||'deleted account')}</div></td>
      <td>${esc(f.look||'–')}</td>
      <td style="max-width:420px;white-space:pre-wrap">${esc(f.text)||'<span class="subtle">no comment</span>'}</td>
      <td class="subtle" style="white-space:nowrap">${fdt(f.created_at)}</td>
      <td>${f.gelesen?'':`<button class="btn ghost sm" data-act="fbRead" data-arg="${f.id}">Mark read</button>`}</td>
    </tr>`).join(''):'<tr><td colspan="6" class="subtle">Nothing here yet.</td></tr>';
  el('view').innerHTML=`
    <div class="grid g4">
      <div class="card"><div class="k">Ratings</div><div class="v">${d.gesamt}</div></div>
      <div class="card acc"><div class="k">Average</div><div class="v">${d.schnitt||'–'} <small>of 5</small></div></div>
      <div class="card"><div class="k">Unread</div><div class="v">${d.offen}</div></div>
      <div class="card"><div class="k">1-2 stars</div><div class="v">${(d.verteilung[1]||0)+(d.verteilung[2]||0)}</div></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="card"><h3 style="margin-top:0">Distribution</h3>${bars}</div>
      <div class="card"><h3 style="margin-top:0">Average per look</h3>
        <table><tr><th>Look</th><th>Ratings</th><th>Ø</th></tr>${looks}</table></div>
    </div>
    <h3>Comments
      <span style="float:right;font-weight:600;text-transform:none;letter-spacing:0">
      ${['all','neu','schlecht'].map(f=>`<button class="btn ${fbFilt===f?'':'ghost'} sm" data-act="fbSet" data-arg="${f}">${f==='all'?'All':f==='neu'?'Unread':'1-2 stars'}</button>`).join(' ')}
      </span></h3>
    <table><tr><th>Rating</th><th>Customer</th><th>Look</th><th>Comment</th><th>When</th><th></th></tr>${rows}</table>`;
}
function fbSet(f){fbFilt=f;loadFeedback();}
async function fbRead(id){await api('/api/admin/feedback/'+id+'/read',{method:'POST'});loadFeedback();refreshBadges();}

/* ---------- v196 ANKUENDIGUNGEN ----------
   Der einzige Weg, Kunden etwas zu sagen, war bisher eine Mail an alle -
   fuer "Wartung heute 20 Uhr" das falsche Mittel. Eine Ankuendigung steht
   IN der App und kann von selbst ablaufen; eine Wartungsmeldung, die jemand
   vergisst abzuschalten, ist schlimmer als keine. */
async function loadAnn(silent){
  let d;try{d=await api('/api/admin/announcements');}catch(e){if(!silent)el('view').innerHTML=err(e);return;}
  lastLoad.ann=Date.now()/1000;
  const rows=d.items.length?d.items.map(a=>{
    const ab=a.bis?fdt(a.bis):'–';
    const weg=a.bis&&a.bis*1000<Date.now();
    return `<tr>
      <td><span class="tag ${a.stufe==='warn'?'warn':a.stufe==='wartung'?'no':'ok'}">${a.stufe}</span></td>
      <td><b>${esc(a.titel)}</b><div class="subtle" style="white-space:pre-wrap;max-width:460px">${esc(a.text)}</div></td>
      <td class="subtle" style="white-space:nowrap">${fdt(a.created_at)}</td>
      <td class="subtle" style="white-space:nowrap">${ab}${weg?' <span class="tag no">expired</span>':''}</td>
      <td>${a.aktiv?'<span class="tag ok">live</span>':'<span class="tag">off</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn ghost sm" data-act="annTog" data-arg="${a.id}">${a.aktiv?'Turn off':'Turn on'}</button>
        <button class="btn ghost sm" data-act="annDel" data-arg="${a.id}">Delete</button></td>
    </tr>`;}).join(''):'<tr><td colspan="6" class="subtle">No announcements yet.</td></tr>';
  el('view').innerHTML=`
    <div class="card">
      <h3 style="margin-top:0">New announcement</h3>
      <p class="subtle" style="margin-bottom:10px">Shows as a banner inside the app
        for every customer. Leave the expiry at 0 for “until I turn it off”.</p>
      <div style="display:flex;flex-direction:column;gap:9px;max-width:620px">
        <input class="search" id="annT" placeholder="Title" maxlength="120">
        <textarea class="search" id="annB" rows="3" placeholder="Text" maxlength="2000"></textarea>
        <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
          <select class="search" id="annS">
            <option value="info">Info</option>
            <option value="warn">Warning</option>
            <option value="wartung">Maintenance</option>
          </select>
          <input class="search" id="annD" type="number" min="0" max="365" step="0.5" value="0"
                 style="width:120px" title="Auto-expire after N days (0 = never)">
          <span class="subtle">days until it expires (0 = never)</span>
          <button class="btn" data-act="annSave">Publish</button>
        </div>
        <p class="msg subtle" id="annMsg"></p>
      </div>
    </div>
    <h3>All announcements</h3>
    <table><tr><th>Level</th><th>Message</th><th>Created</th><th>Expires</th><th>State</th><th></th></tr>${rows}</table>`;
}
async function annSave(){
  const t=el('annT').value.trim(), b=el('annB').value.trim();
  if(!t||!b){el('annMsg').textContent='Title and text are required.';return;}
  const fd=new FormData();
  fd.append('titel',t);fd.append('text',b);
  fd.append('stufe',el('annS').value);fd.append('tage',el('annD').value||'0');
  try{await api('/api/admin/announcements',{method:'POST',body:fd});loadAnn();}
  catch(e){el('annMsg').textContent=e.message;}
}
async function annTog(id){await api('/api/admin/announcements/'+id+'/toggle',{method:'POST'});loadAnn();}
async function annDel(id){if(!danger('Delete this announcement?'))return;
  await api('/api/admin/announcements/'+id+'/delete',{method:'POST'});loadAnn();}

/* v197 Logs. Der Betriebs-Log lag bisher nur in `docker logs` und war nach
   jedem Deploy weg. Jetzt schreibt der Server ihn zusaetzlich in eine
   rotierende Datei; hier steht ihr Ende. */
let logTeil='';
async function loadLogs(silent){
  let d;try{d=await api('/api/admin/logs?zeilen=400'+(logTeil?'&teil='+logTeil:''));}
  catch(e){if(!silent)el('view').innerHTML=err(e);return;}
  lastLoad.logs=Date.now()/1000;
  const wahl=d.dateien.map(f=>{
    const t=f.includes('.log.')?f.split('.log.')[1]:'';
    return `<button class="btn ghost sm${t===logTeil?' on':''}" data-act="logPick" data-arg="${t}">${esc(f)}</button>`;
  }).join(' ');
  el('view').innerHTML=`
    <div class="card">
      <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        ${wahl}
        <span class="subtle" style="margin-left:auto">${(d.bytes/1024).toFixed(0)} KB</span>
        <button class="btn ghost sm" data-act="loadLogs">Refresh</button>
      </div>
      <pre style="max-height:64vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
        font-size:12px;line-height:1.5;margin:0">${esc(d.text)}</pre>
    </div>`;
  const p=el('view').querySelector('pre'); if(p)p.scrollTop=p.scrollHeight;
}
function logPick(t){logTeil=t;loadLogs();}

/* v204-sec Chronik: wer wann was. Bis v203 hielt NICHTS fest, wer sich im
   Panel angemeldet oder ein Konto geaendert hat - nach einem Vorfall waere
   nicht rekonstruierbar gewesen, was passiert ist. */
let evFilt='';
async function loadEvents(silent){
  let d;try{d=await api('/api/admin/events?limit=300'+(evFilt?'&aktion='+encodeURIComponent(evFilt):''));}
  catch(e){if(!silent)el('view').innerHTML=err(e);return;}
  lastLoad.events=Date.now()/1000;
  const knopf=(k,t)=>`<button class="btn ghost sm${evFilt===k?' on':''}" data-act="evSet" data-arg="${k}">${t}</button>`;
  const filter=[knopf('','Alle')].concat(d.arten.map(a=>knopf(a,a))).join(' ');
  const rows=d.events.length?d.events.map(e=>`<tr>
    <td class="subtle" style="white-space:nowrap">${fdt(e.ts)}</td>
    <td><span class="tag${e.aktion.includes('fehl')?' no':e.aktion==='login_ok'?' ok':''}">${esc(e.aktion)}</span></td>
    <td class="mono">${esc(e.wer||'-')}</td>
    <td class="mono subtle">${esc(e.ip||'-')}</td>
    <td class="subtle" style="max-width:340px;word-break:break-all">${esc(e.ziel||'')}</td>
    <td class="subtle">${esc(e.detail||'')}</td></tr>`).join(''):
    '<tr><td colspan="6" class="subtle">Noch nichts protokolliert.</td></tr>';
  el('view').innerHTML=`
    <div class="row-actions" style="margin-bottom:10px;flex-wrap:wrap">${filter}</div>
    <div class="note">Aufbewahrung ${d.aufbewahrung_tage} Tage. Hier steht WER WANN WAS —
      bewusst keine Inhalte (keine Nachrichten, keine Passwoerter).</div>
    <table><thead><tr><th>Wann</th><th>Was</th><th>Wer</th><th>IP</th><th>Wo</th><th>Detail</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}
function evSet(k){evFilt=k;loadEvents();}

/* v204-sec NOTAUS. Der Hebel fuer die Stunde, in der man noch nicht weiss,
   was los ist. 'notaus' beendet zusaetzlich ALLE Kundensitzungen. */
async function loadBetrieb(){
  const box=el('betriebBox'); if(!box)return;
  let d;try{d=await api('/api/admin/betrieb');}catch(e){box.innerHTML=err(e);return;}
  const txt={normal:'Alles laeuft normal.',
             pausiert:'PAUSIERT — keine neuen Uploads, Renders, Kaeufe oder Registrierungen. Fertige Videos bleiben abrufbar.',
             notaus:'NOTAUS — alle Kunden sind abgemeldet, es geht nichts mehr rein.'};
  box.innerHTML=`
    <div class="health" style="margin-bottom:10px">
      ${d.stufe==='normal'?'<span class="tag ok">normal</span>':'<span class="tag no">'+esc(d.stufe)+'</span>'}
      <span class="subtle">${esc(txt[d.stufe]||'')}</span>
    </div>
    <div class="row-actions">
      <button class="btn ghost sm" data-act="setBetrieb" data-arg="normal">Normalbetrieb</button>
      <button class="btn warn sm" data-act="setBetrieb" data-arg="pausiert">Pausieren</button>
      <button class="btn bad sm" data-act="setBetrieb" data-arg="notaus">NOTAUS</button>
    </div>`;
}
async function setBetrieb(stufe){
  const warnung=stufe==='notaus'
    ? 'NOTAUS: alle Kunden werden sofort abgemeldet und es geht nichts mehr rein. Fortfahren?'
    : stufe==='pausiert'
    ? 'Pausieren: keine neuen Uploads, Renders, Kaeufe, Registrierungen. Fortfahren?'
    : 'Zurueck in den Normalbetrieb?';
  if(!danger(warnung))return;
  const fd=new FormData(); fd.append('stufe',stufe);
  try{await api('/api/admin/betrieb',{method:'POST',body:fd});loadBetrieb();}
  catch(e){alert(e.message);}
}

/* v206 STARTSEITE. Vier Fragen, vier Zahlen, jede mit einem Satz Klartext.
   Ismets Befund: das Panel war "unuebersichtlich und kaum benutzerfreundlich",
   mit Begriffen, bei denen er "keine Ahnung habe, was genau das ist" - und er
   wusste nicht, ob die Umsatzzahlen stimmen. Taten sie nicht: sie waren brutto.
   Hier steht jetzt, was GEBLIEBEN ist, und daneben was das heisst. */
function eur(v){return (v||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' &euro;';}
async function loadStart(silent){
  let d;try{d=await api('/api/admin/start');}catch(e){if(!silent)el('view').innerHTML=err(e);return;}
  lastLoad.start=Date.now()/1000;
  const g=d.geld, b=d.betrieb, p=d.post, w=d.wachstum;

  const trend = g.trend_prozent===null||g.trend_prozent===undefined ? ''
    : `<div class="satz">${g.trend_prozent>=0?'+':''}${g.trend_prozent}&nbsp;% gegenueber den 30 Tagen davor.</div>`;
  const erstattet = g.gesamt.erstattet_eur>0
    ? `<div class="satz">Insgesamt eingenommen ${eur(g.gesamt.eur+g.gesamt.erstattet_eur)},
       davon ${eur(g.gesamt.erstattet_eur)} wieder erstattet.</div>`
    : '<div class="satz">Bisher nichts erstattet &mdash; eingenommen ist gleich geblieben.</div>';

  const probleme = b.probleme.length
    ? b.probleme.map(x=>`<div class="satz"><span class="ampel ${x.stufe}"></span>${esc(x.text)}</div>`).join('')
    : '<div class="satz">Keine offenen Punkte. Nichts zu tun.</div>';

  const postSatz = (p.tickets||p.feedback)
    ? `<div class="satz">${p.tickets?p.tickets+' Kunde(n) warten auf eine Antwort. ':''}${p.feedback?p.feedback+' neue Bewertung(en).':''}</div>`
    : '<div class="satz">Niemand wartet auf dich.</div>';

  el('view').innerHTML=`
    <div class="hero">
      <div class="box">
        <div class="frage">VERDIENE ICH GELD?</div>
        <div class="zahl">${eur(g.monat.eur)}<small>letzte 30 Tage</small></div>
        ${trend}
        <div class="satz">Heute ${eur(g.heute.eur)} &middot; Woche ${eur(g.woche.eur)} &middot;
          insgesamt ${eur(g.gesamt.eur)}. Das ist, was nach Erstattungen geblieben ist.</div>
        ${erstattet}
        <div class="tuwas"><button class="btn ghost sm" data-act="go" data-arg="revenue">Details</button></div>
      </div>

      <div class="box ${b.ampel}">
        <div class="frage">LAEUFT ALLES?</div>
        <div class="zahl"><span class="ampel ${b.ampel}"></span>${
          b.ampel==='gruen'?'Alles gut':b.ampel==='gelb'?'Kleinigkeiten':'Kuemmern'}</div>
        ${probleme}
        <div class="satz">${b.laeuft_gerade} Video(s) werden gerade gerendert,
          ${b.wartet} warten.</div>
        <div class="tuwas">
          <button class="btn ghost sm" data-act="go" data-arg="alerts">Stoerungen</button>
          <button class="btn ghost sm" data-act="go" data-arg="system">System</button>
        </div>
      </div>

      <div class="box${(p.tickets||p.feedback)?' gelb':''}">
        <div class="frage">WILL JEMAND ETWAS VON MIR?</div>
        <div class="zahl">${p.tickets}<small>offene Anfragen</small></div>
        ${postSatz}
        ${p.note?`<div class="satz">Durchschnittliche Bewertung ${p.note} von 5
          (${p.bewertungen} Stimmen).</div>`:''}
        <div class="tuwas">
          <button class="btn ghost sm" data-act="go" data-arg="support">Support</button>
          <button class="btn ghost sm" data-act="go" data-arg="feedback">Bewertungen</button>
        </div>
      </div>

      <div class="box">
        <div class="frage">WAECHST ES?</div>
        <div class="zahl">${w.kunden}<small>Konten</small></div>
        <div class="satz">${w.neu_7t} neu in den letzten 7 Tagen.
          ${w.zahler} davon haben schon einmal gekauft.</div>
        <div class="satz">${w.renders_7t} Videos in den letzten 7 Tagen gerendert.</div>
        <div class="tuwas"><button class="btn ghost sm" data-act="go" data-arg="users">Kunden</button></div>
      </div>
    </div>
    <div class="note" style="margin-top:14px">Diese Seite beantwortet die vier Fragen,
      die im Alltag zaehlen. Alles andere &mdash; einzelne Jobs, Codes, Recht &amp; Steuern,
      Technik &mdash; steht unveraendert in den Ansichten links.</div>`;
}

/* v208 TRICHTER. "Wer kam auf die Webseite, und wo verliere ich die Leute?"
   Sechs Stufen von Besucher bis Kauf. Gezaehlt werden MENSCHEN, nicht Klicks.
   Die wichtige Zahl steht rechts an jedem Balken: der Anteil, der es von der
   Stufe darueber bis hierher geschafft hat - dort klemmt es, nicht im
   Gesamtanteil. */
let triTage=30;
function triSetTage(t){triTage=t;loadTrichter();}
async function loadTrichter(silent){
  let d;try{d=await api('/api/admin/trichter?tage='+triTage);}
  catch(e){if(!silent)el('view').innerHTML=err(e);return;}
  lastLoad.trichter=Date.now()/1000;
  const oben=(d.stufen[0]||{}).anzahl||0;
  const rows=d.stufen.map((s,i)=>{
    const br=oben?Math.max(1,Math.round(s.anzahl/oben*100)):0;
    let verlust='';
    if(i>0&&s.von_vorher_prozent!==null&&s.von_vorher_prozent!==undefined){
      const p=s.von_vorher_prozent;
      const kl=p<20?'bad':p<50?'warn':'';
      verlust=`<span class="tdrop ${kl}">${p}&nbsp;% von der Stufe darueber</span>
        &mdash; ${100-p}&nbsp;% springen hier ab.`;
    }else if(i===0){verlust='Das ist die Ausgangsmenge.';}
    return `<div class="trow">
      <div class="tt"><b>${esc(s.titel)}</b><span class="tn">${s.anzahl}</span></div>
      <div class="tbar"><i style="width:${br}%"></i></div>
      <div class="te">${esc(s.erklaerung)} ${verlust}</div>
    </div>`;}).join('');

  const qr=(d.quellen||[]).map(q=>`<tr><td>${esc(q.quelle)}</td>
      <td>${q.besucher}</td><td>${q.konten}</td><td>${q.kaeufer}</td>
      <td>${q.besucher?Math.round(q.konten/q.besucher*100)+'&nbsp;%':'–'}</td></tr>`).join('');

  el('view').innerHTML=`
    <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
      <span class="subtle">Zeitraum:</span>
      ${[7,30,90,365].map(t=>`<button class="btn ${t===triTage?'':'ghost'} sm"
        data-act="triSetTage" data-arg="${t}">${t===365?'1 Jahr':t+' Tage'}</button>`).join('')}
    </div>
    <div class="tri" style="margin-top:12px">${rows}</div>
    <div class="chart" style="margin-top:14px">
      <div class="ct"><b>Woher kamen sie</b><span>letzte ${d.tage} Tage</span></div>
      ${qr?`<table><thead><tr><th>Quelle</th><th>Besucher</th><th>Konten</th>
        <th>Kaeufer</th><th>Konto-Quote</th></tr></thead><tbody>${qr}</tbody></table>`
        :'<div class="spin">Noch keine Daten. Die Zaehlung laeuft ab dem Deploy.</div>'}
      <div class="note">"direkt" heisst: getippt, Lesezeichen, oder die App hat
        die Herkunft nicht mitgeschickt (bei Instagram/TikTok normal).
        Konten und Kaeufer werden der Quelle zugeordnet, aus der der Mensch
        das erste Mal kam.</div>
    </div>
    <div class="note">${esc(d.hinweis||'')}
      ${d.seit?' Erste Zaehlung: '+fdt(d.seit)+'.':''}</div>`;
}

/* v230ah KEINE INLINE-HANDLER MEHR. Bis hierher stand an jedem Knopf ein
   ein Klick-Attribut; damit die Seite lief, musste die CSP `unsafe-inline` fuer
   Skripte erlauben - und genau das haette auch einen eingeschleusten
   <script>-Block ausgefuehrt. Jetzt traegt jeder Knopf nur noch DATEN
   (data-act + data-arg...), und dieser eine Verteiler ruft die Funktion auf.
   Die ERLAUBT-Liste ist der Riegel: was nicht darin steht, wird nicht
   gerufen - ein data-act aus fremdem Text kann also nichts ausloesen. */
const ERLAUBT = {
  saveKey:0, navTog:0, togglePause:0, logout:0, reapStuck:0, factoryReset:0,
  bkUpload:0, offSave:0, offTest:0, offRun:0, offPw:0, newCode:0, annSave:0,
  loadLogs:0,
  go:1, jobLog:1, jobRefund:1, copyLog:1, copyArg:1, copyFreeze:0, openUser:1, dl:1,
  uPage:1, refundSession:1, grantCredits:1, exportUser:1, offRestore:1,
  bkDl:1, bkCheck:1, ticketReply:1, alertRead:1, fbRead:1, fbSet:1,
  annTog:1, annDel:1, logPick:1, evSet:1, setBetrieb:1, triSetTage:1,
  uAct:2, disableUser:2, delUser:2, sysAct:2, bkRestore:2, codeAct:2,
  ticketAct:2,
  jobAct:3,
};
/* Welche Argumente ZAHLEN sind. Pauschal alles Numerische zu wandeln waere
   falsch: eine Job-Nummer oder ein Gutschein-Code kann zufaellig nur aus
   Ziffern bestehen. uPage(-1) dagegen MUSS eine Zahl sein, sonst rechnet
   die Seitenzahl mit Text weiter. */
const ZAHL_ARG = {
  openUser:[0], grantCredits:[0], uAct:[0], disableUser:[0, 1], exportUser:[0],
  delUser:[0], ticketReply:[0], ticketAct:[0], alertRead:[0], fbRead:[0],
  annTog:[0], annDel:[0], triSetTage:[0], uPage:[0], bkRestore:[1],
};
function _args(el, name, n) {
  const roh = [el.dataset.arg, el.dataset.arg2, el.dataset.arg3].slice(0, n);
  const zahlen = ZAHL_ARG[name] || [];
  return roh.map((v, i) => (zahlen.includes(i) && v !== undefined && v !== ''
                            ? Number(v) : v));
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const name = el.dataset.act;
  if (!(name in ERLAUBT)) return;
  const fn = (name === 'copyLog' ? (a) => copyText(LOG_TXT, a === 'still' ? null : el)
              : name === 'copyFreeze' ? () => copyText(FREEZE_TXT, el)
              : name === 'copyArg' ? (a) => copyText(a, el)
              : window[name]);
  if (typeof fn !== 'function') return;
  e.preventDefault();
  fn.apply(null, _args(el, name, ERLAUBT[name]));
});
/* Die vier Faelle, die kein reiner Funktionsaufruf waren. */
document.addEventListener('keydown', (e) => {
  const el = e.target.closest('[data-enter]');
  if (el && e.key === 'Enter' && typeof window[el.dataset.enter] === 'function') {
    window[el.dataset.enter]();
  }
});
document.addEventListener('click', (e) => {
  if (e.target instanceof Element && e.target.hasAttribute('data-overlay')) closeModal();
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-input]');
  if (el && typeof window[el.dataset.input] === 'function') window[el.dataset.input]();
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (el.dataset.change === 'flt') { uState.flt = el.value; uState.offset = 0; fetchUsers(); }
  else if (el.dataset.change === 'sort') { uState.sort = el.value; fetchUsers(); }
});
const RENDER={start:loadStart,trichter:loadTrichter,live:loadLive,logs:loadLogs,events:loadEvents,alerts:loadAlerts,jobs:loadJobs,revenue:loadRevenue,credits:loadCredits,users:loadUsers,support:loadSupport,abuse:loadAbuse,system:loadSystem,offsite:loadOffsite,compliance:loadCompliance,legal:loadLegal,codes:loadCodes,feedback:loadFeedback,ann:loadAnn};
if(KEY)boot();
</script>
