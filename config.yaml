language: auto
output:
  height: 1080
  crf: 18
  preset: medium
  master: false
  speed: standard
  # v101d Safe-Zone-Regie: Ziel-Plattform fuer die UI-Maske im Hochformat.
  # generic = fuer alle Feeds sicher (Schnittmenge). tiktok/reels/shorts =
  # engere, plattform-genaue Maske. Nur bei 9:16 aktiv (effects.safe_zone).
  platform: generic
matting_downsample: auto
fonts:
  display: fonts/archivo.ttf
  italic: fonts/serif_i.ttf
  support: fonts/sans_l.ttf
  script: fonts/playfair_i.ttf
colors:
  style: auto
  text:
  - 248
  - 246
  - 242
  accent:
  - 255
  - 122
  - 26
  adaptive: true
keywords:
  ai: true
  ai_model: gpt-5      # v94: staerkere Regie-KI (war hart gpt-4o). Urteilt
                       # besser welcher Effekt HIER passt + Platzierung.
  auto: true
  emphasize_last: true
  min_gap_seconds: 6
  include: []
  exclude: []
  ai_vision: true
# v101s AUTO-AKZENTE: dezente Motion-Graphics-Akzente (Counter/Chip/Badge/Pop) auf
# dem Transkript. KI (ai_model) schlaegt vor, ohne Key greift die Heuristik. intensity
# (0..2) dosiert die Dichte; das persoenliche Stil-Profil ueberschreibt sie pro Konto.
# Wiring in Editor + Compositing folgt in den naechsten Etappen - hier vorbereitet.
accents:
  auto: true
  ai_model: gpt-5
  intensity: 1.0
effects:
  words_per_group: 3
  words_per_group_max: 5
  chunk_hold_min: 0.65
  zahl_gap: 15
  beat_sync: 0.7
  person_shadow: 0.5
  keyword_rotation:
  - behind
  - cascade
  - blurin
  - outline
  - ground
  breathing: true
  dim_behind: 0.38
  dim_blurin: 0.3
  tracking: true
  sfx: true
  sfx_volume: 0.6
  broll_captions: false
  scene_lock: true
  text_style: 3d
  finish: true
  density: akzente
  caption_flow: true          # v97: Filler-Captions bauen sich inline auf
                              # (Referenz-Look @migs.visuals) - Anker-Wort
                              # gross+getippt+Glow, Abschlusswort kursiv-Akzent.
                              # Dramatik-Momente (behind/cascade) bleiben.
  caption_follow: true        # v97c: Flow-Block folgt der Person sanft +
                              # gedaempft + begrenzt (Struktur bleibt). Aus = fest.
  anim: true
  motion_blur: true
  intro_hook: true
  intro_seconds: 15
  safe_zone: true
  reflection: true
  occlusion: true
  track3d: true
  blender_water: true
  blender_samples: 128
  blender_anim_frames: 12
  blender_width: 1600
  hook_seconds: 15
  hook_strength: 0.5
  instant_hook: true
  retention_gap: 12
  pattern_interrupt: 9
  emerge: auto
  bg_blur: 0.5   # v69: Hintergrund weichzeichnen waehrend Momente (0 = aus, 1 = maximum)
  music_beat: 0.6  # v70: Musik-Beat mit ins Beat-Sync (0 = nur Stimme, 1 = voll)
  # ---- v73: 5 neue Effekt-Klassen ----
  freeze_frame: 0.0   # Sekunden Standbild auf staerkstem Moment (0 = aus, 0.4-1.2 gut)
  trail: 0.0          # Duplicate-Trail Staerke (0 = aus, 0.3-0.6 dezent, 1 = knallig)
  counter_ring: 0.0   # Kreis-Fortschritt um Zahl-Momente (0 = aus)
  split_screen: 0.0   # Split-Screen Staerke (0 = aus, greift bei p.split=True in Regie)
  env_shadow: 0.0     # Kontaktschatten unter ground-Text (0 = aus, 0.5 dezent)
camera:
  strength: 0.7
  crash: 0.55      # Crash-Zoom auf den staerksten Moment (0 = aus)
  whip: false      # Whip-Pan an Abschnittsgrenzen
  side_every: 3
  keyword_rotation:
  - caption
  - punch
  - pan
  - push
  - pullback
  side_rotation:
  - capzoom
  - drift
render:
  blender_path: ''
matting_quality: hoch
