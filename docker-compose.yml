# DouchkoVE Web Stack: Caddy (HTTPS + Reverse-Proxy) + App (Render-Backend).
# Caddy holt Let's Encrypt automatisch, kein certbot noetig.

services:
  app:
    build: .
    container_name: douchko-app
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY fehlt in .env}
      DVE_ADMIN: ${DVE_ADMIN:?DVE_ADMIN fehlt in .env}
      DVE_WORKERS: ${DVE_WORKERS:-1}
      DVE_MAX_SECONDS: ${DVE_MAX_SECONDS:-180}
      DVE_MAX_MB: ${DVE_MAX_MB:-300}
      # v80h/i: Accounts, Trial-Guthaben und Stripe-Payments
      DVE_TRIAL_SECONDS: ${DVE_TRIAL_SECONDS:-120}
      DVE_PUBLIC_URL: ${DVE_PUBLIC_URL:-https://douchko.eu}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # v80w: Mail (Passwort-Reset, spaeter Verifikation)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - dve-data:/data
    expose:
      - "8000"
    # v98: ohne Rotation frisst das Container-Log irgendwann die Platte
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    container_name: douchko-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dve-data:
  caddy-data:
  caddy-config:
